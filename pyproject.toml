[project]
name = "shenblock"
version = "0.5.1"
description = "ShenBlock · inventario y control de red con TUI para laboratorios autorizados"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "scapy>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shenblock = "shenblock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shenblock"]
